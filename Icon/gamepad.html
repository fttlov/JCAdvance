<script>
    var colorMap = {
        'A': '#00ff55', 'B': '#ff1100', 'X': '#00a2ff', 'Y': '#ffee00',
        'LT': '#00bc8c', 'RT': '#00bc8c', 'LB': '#00bc8c', 'RB': '#00bc8c',
        'LS': '#00bc8c', 'RS': '#00bc8c', 'BACK': '#00bc8c', 'START': '#00bc8c',
        'SHARE': '#00bc8c', 'GUIDE': '#00bc8c', 'DPAD': '#00bc8c'
    };

    window.onload = function() {
        var all = document.querySelectorAll('.gamepad-btn');
        for (var i = 0; i < all.length; i++) {
            var el = all[i];
            el.setAttribute('data-default-fill', window.getComputedStyle(el).fill || '');
			
			el.addEventListener('mouseover', function() {
                var btn = this.getAttribute('data-btn');
                if (btn && window.AhkHover) window.AhkHover(btn, true);
            }, false);

            el.addEventListener('mouseout', function() {
                var btn = this.getAttribute('data-btn');
                if (btn && window.AhkHover) window.AhkHover(btn, false);
            }, false);
			
            el.onclick = function() {
                var btn = this.getAttribute('data-btn');
                var self = this;
                var defFill = self.getAttribute('data-default-fill') || '';
                
                // Вспышка на 150 мс для подтверждения клика
                self.style.fill = colorMap[btn] || '#00bc8c';
                setTimeout(function() {
                    self.style.fill = defFill;
                }, 150);

                if (btn && window.AhkClick) window.AhkClick(btn);
            };
        }
    };

	var currentHoverBtn = '';
    var currentActiveMap = {};

    window.setHoverButton = function(btnName) {
        if (currentHoverBtn === btnName) return;
        if (currentHoverBtn) {
            var oldEl = document.querySelector('.gamepad-btn[data-btn="' + currentHoverBtn + '"]');
            if (oldEl && !currentActiveMap[currentHoverBtn])
                oldEl.style.fill = oldEl.getAttribute('data-default-fill') || '';
        }
        currentHoverBtn = btnName || '';
        if (currentHoverBtn) {
            var newEl = document.querySelector('.gamepad-btn[data-btn="' + currentHoverBtn + '"]');
            if (newEl && !currentActiveMap[currentHoverBtn])
                newEl.style.fill = '#58a6ff'; // Мягкий неоново-голубой цвет наведения
        }
    };

    window.setButtons = function(pressedStr) {
        var list = pressedStr ? pressedStr.split(',') : [];
        var active = {};
        for (var i = 0; i < list.length; i++) {
            if (list[i]) active[list[i]] = true;
        }

        var all = document.querySelectorAll('.gamepad-btn');
        for (var j = 0; j < all.length; j++) {
            var el = all[j];
            var btnName = el.getAttribute('data-btn');
            //if (active[btnName]) {
            //    el.style.fill = colorMap[btnName] || '#00bc8c';
            //} else {
            //    el.style.fill = el.getAttribute('data-default-fill') || '';
           // }
		   currentActiveMap = active;
                if (active[btnName]) {
                    el.style.fill = colorMap[btnName] || '#00bc8c';
                } else if (btnName === currentHoverBtn) {
                    el.style.fill = '#58a6ff'; // Мягкий голубой цвет при наведении
                } else {
                    el.style.fill = el.getAttribute('data-default-fill') || '';
                }
        }
    };
</script>
